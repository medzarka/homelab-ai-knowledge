services:
  # ========================================================
  # INITIALIZATION SERVICE (Automated Host Storage Setup)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: knowledge_init_volumes
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Creating storage directories under /data..."
        mkdir -p /data/qdrant /data/mem0/history /data/neo4j/data /data/neo4j/logs /data/pgvector

        echo ">>> [Init] Setting permissions..."
        chmod -R 775 /data

        echo ">>> [Init] AI Knowledge directories initialized successfully! Storage guard active."
        sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -d /data/qdrant && test -d /data/mem0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================
  # QDRANT VECTOR DATABASE (High-Performance Vector Store)
  # ========================================================
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    platform: linux/arm64
    restart: unless-stopped

    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=${QDRANT_SEARCH_THREADS:-2}
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 512M
    depends_on:
      init-volumes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.qdrant.rule=Host(`${QDRANT_DOMAIN:-qdrant.example.com}`)
      - traefik.http.routers.qdrant.entrypoints=websecure
      - traefik.http.routers.qdrant.tls=true
      - traefik.http.routers.qdrant.middlewares=app-fail2ban,security-headers
      - traefik.http.services.qdrant.loadbalancer.server.port=6333
      - traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # MEM0 AGENT MEMORY ENGINE (REST API Server)
  # ========================================================
  mem0-api:
    image: mem0/mem0-api-server:latest
    container_name: mem0-api
    restart: unless-stopped

    environment:
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - VECTOR_STORE=${MEM0_VECTOR_STORE:-qdrant}
      - MEM0_DIR=/app/.mem0
      - HISTORY_DB_PATH=/app/.mem0/history.db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${MEM0_COLLECTION:-memories}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mem0graph_secure_pass}
      - OPENAI_BASE_URL=${LITELLM_API_BASE:-http://litellm:4000/v1}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - LLM_MODEL=${MEM0_LLM_MODEL:-hermes-default}
      - EMBEDDING_MODEL=${MEM0_EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}/mem0/history:/app/.mem0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Mem0] Installing required runtime database drivers..."
        pip install --no-cache-dir qdrant-client neo4j langchain-neo4j rank-bm25

        echo ">>> [Mem0] Patching configuration and security guard in main.py..."
        python3 -c "
        import os, re, textwrap

        with open('/app/main.py', 'r') as f:
            code = f.read()

        qdrant_host = os.environ.get('QDRANT_HOST', 'qdrant')
        qdrant_port = int(os.environ.get('QDRANT_PORT', '6333'))
        qdrant_api_key = os.environ.get('QDRANT_API_KEY') or None
        qdrant_collection = os.environ.get('QDRANT_COLLECTION', 'memories')

        neo4j_uri = os.environ.get('NEO4J_URI', 'bolt://neo4j:7687')
        neo4j_user = os.environ.get('NEO4J_USERNAME', 'neo4j')
        neo4j_pass = os.environ.get('NEO4J_PASSWORD', 'mem0graph_secure_pass')

        openai_base_url = os.environ.get('OPENAI_BASE_URL', 'http://litellm:4000/v1')
        openai_api_key = os.environ.get('OPENAI_API_KEY', '')
        llm_model = os.environ.get('LLM_MODEL', 'hermes-default')
        embedding_model = os.environ.get('EMBEDDING_MODEL', 'BAAI/bge-m3')
        history_db = os.environ.get('HISTORY_DB_PATH', '/app/.mem0/history.db')

        new_config_block = f'''DEFAULT_CONFIG = {{
            \"version\": \"v1.1\",
            \"vector_store\": {{
                \"provider\": \"qdrant\",
                \"config\": {{
                    \"url\": \"http://{qdrant_host}:{qdrant_port}\",
                    \"api_key\": {repr(qdrant_api_key)},
                    \"collection_name\": \"{qdrant_collection}\"
                }}
            }},
            \"graph_store\": {{
                \"provider\": \"neo4j\",
                \"config\": {{
                    \"url\": \"{neo4j_uri}\",
                    \"username\": \"{neo4j_user}\",
                    \"password\": \"{neo4j_pass}\"
                }}
            }},
            \"llm\": {{
                \"provider\": \"openai\",
                \"config\": {{
                    \"api_key\": \"{openai_api_key}\",
                    \"openai_base_url\": \"{openai_base_url}\",
                    \"temperature\": 0.2,
                    \"model\": \"{llm_model}\"
                }}
            }},
            \"embedder\": {{
                \"provider\": \"openai\",
                \"config\": {{
                    \"api_key\": \"{openai_api_key}\",
                    \"openai_base_url\": \"{openai_base_url}\",
                    \"model\": \"{embedding_model}\"
                }}
            }},
            \"history_db_path\": \"{history_db}\"
        }}'''

        code = re.sub(r'DEFAULT_CONFIG\s*=\s*\{.*?\n\}', new_config_block, code, flags=re.DOTALL)

        auth_middleware = textwrap.dedent('''
        from fastapi import Request
        from fastapi.responses import JSONResponse

        @app.middleware(\"http\")
        async def api_key_auth_middleware(request: Request, call_next):
            expected_key = os.environ.get(\"MEM0_API_KEY\")
            if expected_key:
                if request.url.path in [\"/docs\", \"/openapi.json\", \"/redoc\", \"/\"]:
                    return await call_next(request)
                auth_header = request.headers.get(\"Authorization\", \"\")
                api_key_header = request.headers.get(\"X-API-Key\", \"\") or request.headers.get(\"api-key\", \"\")
                token = \"\"
                if auth_header.startswith(\"Bearer \"):
                    token = auth_header[7:].strip()
                elif auth_header:
                    token = auth_header.strip()
                elif api_key_header:
                    token = api_key_header.strip()
                
                if token != expected_key:
                    return JSONResponse(status_code=401, content={\"detail\": \"Invalid or missing Mem0 API Key\"})
            return await call_next(request)
        ''')

        if 'api_key_auth_middleware' not in code:
            code = re.sub(r'(app = FastAPI\([^)]+\))', r'\1\n' + auth_middleware, code)

        with open('/app/main.py', 'w') as f:
            f.write(code)
        print('Mem0 startup patch applied: Qdrant + Neo4j + Security guard active.')
        "

        echo ">>> [Mem0] Starting Uvicorn API server on port 8000..."
        exec uvicorn main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/openapi.json\").read()' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    depends_on:
      init-volumes:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.mem0.rule=Host(`${MEM0_DOMAIN:-mem0.example.com}`)
      - traefik.http.routers.mem0.entrypoints=websecure
      - traefik.http.routers.mem0.tls=true
      - traefik.http.routers.mem0.middlewares=app-fail2ban,security-headers
      - traefik.http.services.mem0.loadbalancer.server.port=8000
      - traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # NEO4J GRAPH DATABASE (Graph Memory for Entities & Relations)
  # ========================================================
  neo4j:
    image: neo4j:5.21.0-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mem0graph_secure_pass}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # Memory tuning for OCI Flex ARM64 (2-4 vCPU / 10-32GB RAM)
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1024M
      - NEO4J_server_memory_pagecache_size=512M
    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}/neo4j/data:/data
      - ${DATA_DIR:-/srv/data/ai-knowledge}/neo4j/logs:/logs

    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    depends_on:
      init-volumes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.neo4j.rule=Host(`${NEO4J_DOMAIN:-neo4j.example.com}`)
      - traefik.http.routers.neo4j.entrypoints=websecure
      - traefik.http.routers.neo4j.tls=true
      - traefik.http.routers.neo4j.middlewares=app-fail2ban,security-headers
      - traefik.http.services.neo4j.loadbalancer.server.port=7474
      - traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # HOMELAB AI KNOWLEDGE MCP SERVER (Unified Knowledge Hub)
  # Multi-Modal Qdrant Ingestion, Page-by-Page PDF, Neo4j, Mem0
  # ========================================================
  knowledge-mcp:
    build:
      context: ./knowledge-mcp
      dockerfile: Dockerfile
    image: ghcr.io/medzarka/homelab-knowledge-mcp:latest
    container_name: knowledge_mcp
    restart: unless-stopped

    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_WORKSPACE=${QDRANT_COLLECTION_WORKSPACE:-workspace}
      - VECTOR_DIMENSIONS=1024
      - PDF_RENDER_DPI=${PDF_RENDER_DPI:-150}
      - MAX_CONCURRENT_INDEXING_JOBS=${MAX_CONCURRENT_INDEXING_JOBS:-1}
      - INDEXING_REQUEST_TIMEOUT=${INDEXING_REQUEST_TIMEOUT:-300}
      - EMBEDDING_PRIMARY_URL=${EMBEDDING_PRIMARY_URL:-http://compute_embeddings:80/embed}
      - EMBEDDING_FALLBACK_URL=${EMBEDDING_FALLBACK_URL:-http://litellm:4000/v1/embeddings}
      - EMBEDDING_FALLBACK_KEY=${LITELLM_MASTER_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - RERANKER_PRIMARY_URL=${RERANKER_PRIMARY_URL:-http://compute_reranker:80/rerank}
      - RERANKER_FALLBACK_URL=${RERANKER_FALLBACK_URL:-http://litellm:4000/v1/rerank}
      - RERANKER_FALLBACK_KEY=${LITELLM_MASTER_KEY:-}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - VISION_PRIMARY_PROVIDER=local
      - VISION_PRIMARY_URL=${VISION_PRIMARY_URL:-http://compute_ollama:11434/api/chat}
      - VISION_PRIMARY_MODEL=${VISION_PRIMARY_MODEL:-qwen2.5vl:3b}
      - VISION_FALLBACK_PROVIDER=litellm
      - VISION_FALLBACK_URL=${VISION_FALLBACK_URL:-http://litellm:4000/v1/chat/completions}
      - VISION_FALLBACK_KEY=${LITELLM_MASTER_KEY:-}
      - VISION_FALLBACK_MODEL=${VISION_FALLBACK_MODEL:-google/gemini-2.0-flash}
      - AUDIO_PRIMARY_URL=${AUDIO_PRIMARY_URL:-http://compute_speaches:8000/v1/audio/transcriptions}
      - AUDIO_PRIMARY_MODEL=${AUDIO_PRIMARY_MODEL:-Systran/faster-whisper-large-v3}
      - AUDIO_FALLBACK_URL=${AUDIO_FALLBACK_URL:-http://litellm:4000/v1/audio/transcriptions}
      - AUDIO_FALLBACK_KEY=${LITELLM_MASTER_KEY:-}
      - AUDIO_FALLBACK_MODEL=${AUDIO_FALLBACK_MODEL:-openai/whisper-1}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mem0graph_secure_pass}
      - MEM0_API_URL=http://mem0-api:8000
      - MEM0_API_KEY=${MEM0_API_KEY:-}
    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}/workspace:/workspace
    depends_on:
      qdrant:
        condition: service_healthy
      init-volumes:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.knowledge-mcp.rule=Host(`${KNOWLEDGE_MCP_DOMAIN:-knowledge-mcp.example.com}`)
      - traefik.http.routers.knowledge-mcp.entrypoints=websecure
      - traefik.http.routers.knowledge-mcp.tls=true
      - traefik.http.routers.knowledge-mcp.middlewares=app-fail2ban,security-headers
      - traefik.http.services.knowledge-mcp.loadbalancer.server.port=8095
      - traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
  homelab_swarm_net:
    name: ${SWARM_NETWORK:-homelab_swarm_net}
    external: true
