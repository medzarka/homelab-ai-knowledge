services:
  # ========================================================
  # INITIALIZATION SERVICE (Automated Host Storage Setup)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: knowledge_init_volumes
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Creating storage directories under /data..."
        mkdir -p /data/qdrant /data/mem0/history /data/neo4j/data /data/neo4j/logs /data/pgvector

        echo ">>> [Init] Setting permissions..."
        chmod -R 775 /data

        echo ">>> [Init] AI Knowledge directories initialized successfully! Storage guard active."
        sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -d /data/qdrant && test -d /data/mem0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================
  # QDRANT VECTOR DATABASE (High-Performance Vector Store)
  # ========================================================
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333" # HTTP REST API & Web Dashboard
      - "${QDRANT_GRPC_PORT:-6334}:6334" # High-throughput gRPC
    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=${QDRANT_SEARCH_THREADS:-2}
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 512M
    depends_on:
      init-volumes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.qdrant.rule=Host(`${QDRANT_DOMAIN:-qdrant.example.com}`)
      - traefik.http.routers.qdrant.entrypoints=websecure
      - traefik.http.routers.qdrant.tls=true
      - traefik.http.routers.qdrant.middlewares=app-fail2ban,security-headers
      - traefik.http.services.qdrant.loadbalancer.server.port=6333
      - traefik.docker.network=${SHARED_NETWORK:-shared_net}
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # MEM0 AGENT MEMORY ENGINE (REST API Server)
  # ========================================================
  mem0-api:
    image: mem0/mem0-api-server:latest
    container_name: mem0-api
    restart: unless-stopped
    ports:
      - "${MEM0_API_PORT:-8000}:8000"
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - VECTOR_STORE=${MEM0_VECTOR_STORE:-qdrant}
      - MEM0_DIR=/app/.mem0
      - HISTORY_DB_PATH=/app/.mem0/history.db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${MEM0_COLLECTION:-memories}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mem0graph_secure_pass}
      - OPENAI_BASE_URL=${LITELLM_API_BASE:-http://litellm:4000/v1}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - LLM_MODEL=${MEM0_LLM_MODEL:-hermes-default}
      - EMBEDDING_MODEL=${MEM0_EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}/mem0/history:/app/.mem0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Mem0] Installing required runtime database drivers..."
        pip install --no-cache-dir qdrant-client psycopg[pool] psycopg2-binary networkx langchain-neo4j rank-bm25

        echo ">>> [Mem0] Injecting API Key authentication guard..."
        python3 -c "
        import os, re, textwrap
        with open('/app/main.py', 'r') as f:
            code = f.read()

        auth_middleware = textwrap.dedent('''
        from fastapi import Request
        from fastapi.responses import JSONResponse

        @app.middleware(\"http\")
        async def api_key_auth_middleware(request: Request, call_next):
            expected_key = os.environ.get(\"MEM0_API_KEY\")
            if expected_key:
                if request.url.path in [\"/docs\", \"/openapi.json\", \"/redoc\", \"/\"]:
                    return await call_next(request)
                auth_header = request.headers.get(\"Authorization\", \"\")
                api_key_header = request.headers.get(\"X-API-Key\", \"\") or request.headers.get(\"api-key\", \"\")
                token = \"\"
                if auth_header.startswith(\"Bearer \"):
                    token = auth_header[7:].strip()
                elif auth_header:
                    token = auth_header.strip()
                elif api_key_header:
                    token = api_key_header.strip()
                
                if token != expected_key:
                    return JSONResponse(status_code=401, content={\"detail\": \"Invalid or missing Mem0 API Key\"})
            return await call_next(request)
        ''')

        if 'api_key_auth_middleware' not in code:
            code = re.sub(r'(app = FastAPI\([^)]+\))', r'\1\n' + auth_middleware, code)
            with open('/app/main.py', 'w') as f:
                f.write(code)
            print('Security middleware active: MEM0_API_KEY enforced on all endpoints.')
        "

        echo ">>> [Mem0] Starting Uvicorn API server in background..."
        uvicorn main:app --host 0.0.0.0 --port 8000 &

        echo ">>> [Mem0] Waiting for API server to be ready..."
        python3 -c "
        import urllib.request, time
        while True:
            try:
                urllib.request.urlopen('http://127.0.0.1:8000/openapi.json').read()
                break
            except Exception:
                time.sleep(2)
        "

        echo ">>> [Mem0] API is up! Applying dynamic configuration..."
        python3 -c "
        import urllib.request, json, os

        vector_provider = os.environ.get('VECTOR_STORE', 'qdrant')
        
        if vector_provider == 'qdrant':
            vector_config = {
                'provider': 'qdrant',
                'config': {
                    'host': 'qdrant',
                    'port': 6333,
                    'api_key': os.environ.get('QDRANT_API_KEY') or None,
                    'collection_name': os.environ.get('QDRANT_COLLECTION', 'memories')
                }
            }
        else:
            vector_config = {
                'provider': 'pgvector',
                'config': {
                    'host': 'mem0-pgvector',
                    'port': 5432,
                    'dbname': os.environ.get('PGVECTOR_DB', 'mem0'),
                    'user': os.environ.get('PGVECTOR_USER', 'postgres'),
                    'password': os.environ.get('PGVECTOR_PASSWORD', 'postgres'),
                    'collection_name': os.environ.get('QDRANT_COLLECTION', 'memories')
                }
            }

        cfg = {
            'version': 'v1.1',
            'vector_store': vector_config,
            'graph_store': {
                'provider': 'neo4j',
                'config': {
                    'url': os.environ.get('NEO4J_URI', 'bolt://neo4j:7687'),
                    'username': os.environ.get('NEO4J_USERNAME', 'neo4j'),
                    'password': os.environ.get('NEO4J_PASSWORD', 'mem0graph_secure_pass')
                }
            },
            'llm': {
                'provider': 'openai',
                'config': {
                    'api_key': os.environ.get('OPENAI_API_KEY', ''),
                    'openai_base_url': os.environ.get('OPENAI_BASE_URL', ''),
                    'model': os.environ.get('LLM_MODEL', 'hermes-default')
                }
            },
            'embedder': {
                'provider': 'openai',
                'config': {
                    'api_key': os.environ.get('OPENAI_API_KEY', ''),
                    'openai_base_url': os.environ.get('OPENAI_BASE_URL', ''),
                    'model': os.environ.get('EMBEDDING_MODEL', 'BAAI/bge-m3')
                }
            },
            'history_db_path': '/app/.mem0/history.db'
        }

        try:
            req = urllib.request.Request('http://127.0.0.1:8000/configure', method='POST')
            req.add_header('Content-Type', 'application/json')
            mem0_key = os.environ.get('MEM0_API_KEY')
            if mem0_key:
                req.add_header('Authorization', 'Bearer ' + mem0_key)
            with urllib.request.urlopen(req, data=json.dumps(cfg).encode('utf-8')) as res:
                print('Configuration response:', res.read().decode('utf-8'))
        except Exception as e:
            print('Configuration notice:', e)
        "

        echo ">>> [Mem0] Configuration applied! Waiting on service..."
        wait
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/openapi.json\").read()' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      init-volumes:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.mem0.rule=Host(`${MEM0_DOMAIN:-mem0.example.com}`)
      - traefik.http.routers.mem0.entrypoints=websecure
      - traefik.http.routers.mem0.tls=true
      - traefik.http.routers.mem0.middlewares=app-fail2ban,security-headers
      - traefik.http.services.mem0.loadbalancer.server.port=8000
      - traefik.docker.network=${SHARED_NETWORK:-shared_net}
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # NEO4J GRAPH DATABASE (Graph Memory for Entities & Relations)
  # ========================================================
  neo4j:
    image: neo4j:5.21.0-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mem0graph_secure_pass}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # Memory tuning for OCI Flex ARM64 (2-4 vCPU / 10-32GB RAM)
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1024M
      - NEO4J_server_memory_pagecache_size=512M
    volumes:
      - ${DATA_DIR:-/srv/data/ai-knowledge}/neo4j/data:/data
      - ${DATA_DIR:-/srv/data/ai-knowledge}/neo4j/logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP Browser Console
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt protocol
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    depends_on:
      init-volumes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.neo4j.rule=Host(`${NEO4J_DOMAIN:-neo4j.example.com}`)
      - traefik.http.routers.neo4j.entrypoints=websecure
      - traefik.http.routers.neo4j.tls=true
      - traefik.http.routers.neo4j.middlewares=app-fail2ban,security-headers
      - traefik.http.services.neo4j.loadbalancer.server.port=7474
      - traefik.docker.network=${SHARED_NETWORK:-shared_net}
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
